<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14060f">
<title>For Shreyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Nunito+Sans:wght@300;400;600&family=Reenie+Beanie&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- Stage curtains: tap the button to raise them and start the song -->
<div id="curtains">
  <div class="valance"></div>
  <div class="cur l"></div>
  <div class="cur r"></div>
  <div class="curtain-ui">
    <p class="script">the show is about to begin</p>
    <h2 id="introName">Shreyu</h2>
    <button id="raise" class="btn">Raise the curtain</button>
  </div>
</div>

<main id="story">
  <section class="screen hero">
    <div class="spot"></div>
    <p class="script" id="heroTop">happy 19th birthday</p>
    <h1 id="herName" aria-label="Shreyu"></h1>
    <p class="hero-sub" id="heroSub"></p>
    <span class="scroll-hint">swipe up</span>
  </section>

  <section class="screen">
    <h2 class="reveal">Where it began</h2>
    <p class="lead reveal" id="beganText"></p>
  </section>

  <section class="screen wide">
    <h2>Our best scenes</h2>
    <p class="lead small" id="scenesText"></p>
    <div class="rail" id="polaroids"></div>
  </section>

  <section class="screen wide">
    <h2>Saved for you</h2>
    <p class="lead small">Frames I kept.</p>
    <div class="rail" id="chats"></div>
  </section>

  <section class="screen wide">
    <h2>Roll the camera</h2>
    <div class="rail" id="videos"></div>
  </section>

  <section class="screen">
    <h2>A letter, backstage</h2>
    <div class="letter" id="letter"></div>
    <p class="sign" id="sign"></p>
  </section>

  <section class="screen finale">
    <p class="big19" id="big19">0</p>
    <p class="script" id="finalLine"></p>
    <button id="bow" class="btn">Take a bow</button>
  </section>
</main>

<button id="music" aria-label="Toggle music" hidden>♪</button>
<audio id="song" src="media/song.mp3" loop preload="auto"></audio>
<script src="script.js"></script>
</body>
</html>
